<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - AcadHub</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="frontend/assets/logo.png">

  <!-- Estilos -->
  <link rel="stylesheet" href="frontend/style.css">
</head>

<body class="login-page">

<main class="container">

  <!-- Lado Azul (logo + link) -->
  <div class="lado-azul">
    <div class="conteudo-lado-azul">
      <img src="frontend/assets/logo.png" alt="Logo" class="imagem-centralizada">

      <div class="link-cadastro">
        Ainda não tem uma conta?  
        <a href="cadastro.html" class="btn-secondary">Cadastrar</a>
      </div>
    </div>
  </div>

  <!-- Lado Branco (formulário) -->
  <div class="lado-branco">

    <h1>Login</h1>

    <form id="form-login">

      <div class="input-group">
        <label for="email">E-mail:</label>
        <input type="email" id="email" required placeholder="exemplo@acadhub.com">
      </div>

      <div class="input-group">
        <label for="senha">Senha:</label>
        <input type="password" id="senha" required placeholder="Sua senha">
      </div>

      <button type="submit" class="btn-primary">Entrar</button>
    </form>
  </div>

</main>


<script>
// Base do backend (local 4000 ou nuvem)
const BASE_URL = window.BASE_URL || "http://localhost:4000";

// Login do usuário
document.getElementById("form-login").addEventListener("submit", async (e) => {
  e.preventDefault();

  const email = email.value.trim();
  const senha = senha.value.trim();

  if (!email || !senha)
    return alert("Preencha todos os campos.");

  if (!/.+@.+\..+/.test(email))
    return alert("Digite um e-mail válido.");

  try {
    const res = await fetch(`${BASE_URL}/api/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, senha })
    });

    let data;
    try { data = await res.json(); }
    catch { data = { message: "Erro inesperado do servidor." }; }

    if (res.ok && data.token) {
      localStorage.setItem("token", data.token);
      window.location.href = "upload.html";
      return;
    }

    alert(data.error || data.message || "Erro ao efetuar login.");

  } catch (err) {
    console.error("Erro:", err);
    alert("Servidor indisponível. Verifique se está rodando localmente (porta 4000).");
  }
});
</script>

</body>
</html>
