<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Upload - AcadHub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="frontend/style.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="frontend/assets/logo.png">
</head>

<body>

<!-- NAVBAR GLOBAL -->
<div id="navbar"></div>

<script>
  // Insere automaticamente a navbar às páginas
  fetch("frontend/components/navbar.html")
    .then(res => res.text())
    .then(html => {
      document.getElementById("navbar").innerHTML = html;
    });
</script>

<main class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">

      <div class="card shadow-sm">
        <div class="card-body">

          <h5 class="card-title mb-4">Enviar Resumo</h5>

          <!-- Formulário -->
          <form id="form-upload" enctype="multipart/form-data" novalidate>

            <div class="mb-3">
              <label for="titulo" class="form-label">Título</label>
              <input type="text" class="form-control" id="titulo" name="titulo" required>
            </div>

            <div class="mb-3">
              <label for="descricao" class="form-label">Descrição</label>
              <textarea class="form-control" id="descricao" name="descricao" rows="3"></textarea>
            </div>

            <div class="mb-3">
              <label for="curso" class="form-label">Curso</label>
              <input type="text" class="form-control" id="curso" name="curso">
            </div>

            <div class="mb-3">
              <label for="arquivo" class="form-label">Arquivo (PDF/DOCX)</label>
              <input type="file" class="form-control" id="arquivo" name="arquivo" accept=".pdf,.doc,.docx" required>
            </div>

            <button id="btn-enviar" type="submit" class="btn btn-primary w-100">
              Enviar
            </button>

          </form>

        </div>
      </div>

    </div>
  </div>
</main>

<script>
// Base da API: local + nuvem
const BASE_URL = window.BASE_URL || "http://localhost:4000";

// Verifica se o usuário está logado
(function validateAuth() {
  const token = localStorage.getItem("token");

  if (!token) {
    window.location.href = "login.html";
  }
})();


// Envio do formulário
document.getElementById("form-upload").addEventListener("submit", async (e) => {
  e.preventDefault();

  const form = e.currentTarget;
  const token = localStorage.getItem("token");

  if (!token) {
    return window.location.href = "login.html";
  }

  const formData = new FormData(form);

  try {
    const res = await fetch(`${BASE_URL}/api/upload`, {
      method: "POST",
      body: formData,
      headers: {
        // arquivo NÃO precisa de Content-Type
        "Authorization": "Bearer " + token
      }
    });

    let data;
    try { data = await res.json(); }
    catch { data = { message: await res.text() }; }

    if (res.ok) {
      alert("Resumo enviado com sucesso!");
      form.reset();
      return;
    }

    console.error("Erro no upload:", res.status, data);
    alert(data.message || "Erro ao enviar o arquivo.");

  } catch (err) {

    console.error("Erro de conexão:", err);
    alert("Servidor offline. Certifique-se que o backend está rodando na porta 4000.");
  }
});
</script>

<!-- Bootstrap JS para navbar responsiva -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
