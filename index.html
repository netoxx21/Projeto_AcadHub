<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="frontend/assets/logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro-AcadHub</title>
    <link rel="stylesheet" href="frontend/style.css">
</head>
<body class="login-page">
    
    <main class="container">
        
        <div class="lado-azul">
            <div class="conteudo-lado-azul">
                <img src="frontend/assets/logo.png" alt="Ícone AcadHub" class="imagem-centralizada">
                
                <div class="link-cadastro">
                    Já tem uma conta? <a href="login.html">Fazer Login</a>
                </div>
            </div>
        </div>
        
        <div class="lado-branco">
            
            <h1>Cadastro</h1>
            
            <form id="form-cadastro">
                
                <div class="input-group">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" required placeholder="Seu nome completo">
                </div>

                <div class="input-group">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required placeholder="exemplo@acadhub.com">
                </div>

                <div class="input-group">
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" name="senha" required placeholder="Mínimo 8 caracteres">
                </div>

                <div class="input-group">
                    <label for="confirmar-senha">Confirme a Senha:</label>
                    <input type="password" id="confirmar-senha" name="confirmar-senha" required placeholder="Confirme sua senha">
                </div>

                <button type="submit" class="btn-primary">Cadastrar</button>
            </form>

        </div>
    </main>
<script>

// CONFIGURAÇÃO DE AMBIENTE
const BASE_URL = window.BASE_URL || "http://localhost:4000";

// EVENTO DE ENVIO DO FORMULÁRIO DE CADASTRO
document.getElementById("form-cadastro").addEventListener("submit", async (e) => {
  e.preventDefault();

  // Captura dos campos
  const nome = document.getElementById("nome").value.trim();
  const email = document.getElementById("email").value.trim();
  const senha = document.getElementById("senha").value.trim();
  const confirmarSenha = document.getElementById("confirmar-senha").value.trim();

  // VALIDAÇÕES BÁSICAS
  if (!nome || !email || !senha || !confirmarSenha) {
    return alert("Preencha todos os campos.");
  }

  if (senha.length < 8) {
    return alert("A senha deve conter no mínimo 8 caracteres.");
  }

  if (senha !== confirmarSenha) {
    return alert("As senhas não coincidem.");
  }

  // REQUISIÇÃO AO BACKEND
  try {
    const res = await fetch(`${BASE_URL}/api/cadastro`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ nome, email, senha }),
    });

    let data;
    try {
      data = await res.json();
    } catch {
      data = { message: "Erro inesperado. Tente novamente." };
    }

    // CADASTRO REALIZADO COM SUCESSO
    if (res.ok) {
      alert("Cadastro realizado com sucesso! Faça login.");
      return window.location.href = "login.html";
    }

    // ERRO RETORNADO PELO BACKEND
    alert(data.error || data.message || "Erro ao realizar cadastro.");

  } catch (err) {

    // ERRO AO CONECTAR AO SERVIDOR
    console.error("Erro de conexão:", err);
    alert("Falha ao conectar ao servidor.");
  }
});
</script>


</body>
</html>
